name: パターン研究用データ集め（pattern-labブランチ専用・お金は使わない）

on:
  push:
    branches: [pattern-lab]
    paths: [".github/lab-fetch-request"]

permissions:
  contents: write

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        pair: [btc_jpy, eth_jpy, xrp_jpy]
        year: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m lab.fetch part ${{ matrix.pair }} ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.pair }}-${{ matrix.year }}
          path: lab/data/parts/
  merge:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: lab/data/parts/
          merge-multiple: true
      - run: python -m lab.fetch merge
      - name: 保存（pattern-labブランチのみ）
        run: |
          git config user.name "root-bot"
          git config user.email "root-bot@users.noreply.github.com"
          git add lab/data/*.csv.gz
          git diff --cached --quiet || git commit -m "lab data" -q
          git pull --rebase -q origin pattern-lab && git push -q origin HEAD:pattern-lab
