name: root_bot 定期実行

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごと（GitHubの混雑で数分遅れることがあります）
  workflow_dispatch: {}

concurrency:
  group: root-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1回分の売買判断
        env:
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          BITBANK_API_KEY: ${{ secrets.BITBANK_API_KEY }}
          BITBANK_API_SECRET: ${{ secrets.BITBANK_API_SECRET }}
        run: python -m bot.run
      - name: 状態を保存
        run: |
          git config user.name "root-bot"
          git config user.email "root-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "tick $(date -u +%FT%TZ)" -q
          git pull --rebase -q && git push -q
