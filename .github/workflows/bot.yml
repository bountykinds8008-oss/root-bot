name: root_bot 定期実行

on:
  schedule:
    # 1時間に2回。GitHubの定期実行は混雑時に遅れたり抜けたりする（公式に明記）ので、回数を増やして間隔を詰める。
    # 無料枠は月2,000分。1回1分として最大 48回×31日＝1,488分に収まる。
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]

concurrency:
  group: root-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1回分の売買判断
        env:
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          BITBANK_API_KEY: ${{ secrets.BITBANK_API_KEY }}
          BITBANK_API_SECRET: ${{ secrets.BITBANK_API_SECRET }}
        run: python -m bot.run
      - name: 状態を保存
        run: |
          git config user.name "root-bot"
          git config user.email "root-bot@users.noreply.github.com"
          git add data/ dashboard/data/
          git diff --cached --quiet || git commit -m "tick $(date -u +%FT%TZ)" -q
          git pull --rebase -q && git push -q
