name: root_bot 定期実行

on:
  schedule:
    - cron: "11,41 * * * *"   # 30分ごと（GitHub側で間引かれても、engine が飛ばした足を後追い処理する）
                              # 1回約1分 × 最大1440回/月 ＝ 無料枠2000分/月の内側
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]

concurrency:
  group: root-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 動作テスト（失敗したら売買しない）
        run: python -m unittest discover -s tests -t . -q
      - name: 1回分の売買判断
        env:
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          BITBANK_API_KEY: ${{ secrets.BITBANK_API_KEY }}
          BITBANK_API_SECRET: ${{ secrets.BITBANK_API_SECRET }}
        run: python -m bot.run
      - name: 状態を保存
        run: |
          git config user.name "root-bot"
          git config user.email "root-bot@users.noreply.github.com"
          git add data/ dashboard/data/
          git diff --cached --quiet || git commit -m "tick $(date -u +%FT%TZ)" -q
          git pull --rebase -q && git push -q
